# Tests of each PR, Dependabot's included, before it can be merged and deployed.
# No secrets or GCP access: the tests need no database
name: Tests

on:
  pull_request:

permissions:
  contents: read

# A new push on the PR cancels the run of the previous one
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before setup-python, which caches the dependencies with it
      - run: pipx install "poetry==2.4.3"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: poetry
      - run: poetry install --no-root
      - run: poetry run pytest
