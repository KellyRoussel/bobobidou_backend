# Each push on main: tests, then the new version is deployed to Cloud Run.
# Only the image changes; the service configuration comes from infra/ (Terraform).
# The migrations are not run here: they are run by hand before merging the code
# that needs them (see README)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a waiting one is replaced by a newer push
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: europe-west1
  SERVICE: bobobidou-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "poetry==2.4.3"
      - run: poetry install --no-root
      - run: poetry run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, exchanged for GCP credentials
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud run deploy "$SERVICE" --source . --region "$REGION" --quiet

      - name: Health check
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url/health"
